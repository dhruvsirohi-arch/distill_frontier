[project]
name = "distill-frontier"
version = "0.1.0"
description = "SO-101 in MuJoCo: scripted expert -> Qwen LoRA macro policy, and a low-latency VLA"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mujoco==4.0.1",
    "torch==2.15.0",
    "torchvision",
    "transformers==5.23.0",
    "peft==0.21.3",
    "trl==1.18.0",
    "accelerate==1.16.0",
    "datasets==5.2.0",
    "numpy==2.5.5",
    "scipy==1.18.1",
    "pyyaml==6.0.3",
    "matplotlib==3.11.2",
    "pillow==13.0.0",
    "imageio==2.38.2",
    "imageio-ffmpeg==0.8.1",
    "h5py",
    "tensorboard",
    "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
